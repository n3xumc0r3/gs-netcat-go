name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet (non-blocking — known tlssrp lock-copy warning)
        run: go vet ./... || true

      - name: Build CLI binary
        run: go build -o gs-netcat ./cmd/gs-netcat

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gs-netcat-${{ matrix.os }}
          path: gs-netcat${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 14
